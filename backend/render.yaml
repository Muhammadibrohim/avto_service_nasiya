services:
  - type: web
    name: avto-service-nasiya-api
    runtime: node
    rootDir: backend
    # --include=dev: TypeScript is needed for the build even with NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TELEGRAM_MENU_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: REMINDER_HOUR
        value: 9
      - key: UZBEKVOICE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-fable-5-1
